[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-contracts"
version = "0.1.0"
description = "Draft exchange contracts for the GeoAI desktop architecture"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.141,<0.142", "uvicorn>=0.49,<0.50"]
test = ["httpx>=0.28,<0.29"]
db = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["backend"]
