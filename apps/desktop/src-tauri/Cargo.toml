[package]
name = "geoai-desktop"
version = "0.1.0"
edition = "2021"
default-run = "geoai-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6.2.1"
nix = { version = "0.31.3", features = ["user", "fs"] }
libc = "0.2.191"
getrandom = "0.4.3"
